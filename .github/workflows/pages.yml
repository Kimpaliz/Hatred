# [Aufgabe: Werkzeug] Das Spiel ins Netz stellen — die Adresse für die Freunde.
#
# ── Warum hier kein Bauschritt steht ─────────────────────────────────
#
# Das Spiel ist reines HTML mit ES-Modulen und hat null Abhängigkeiten.
# Es gibt nichts zu übersetzen und nichts zu bündeln — der Ordner, der
# im Repository liegt, ist derselbe, der ausgeliefert wird. Das ist kein
# Sparen, sondern die Absicherung: Was hier live geht, ist byteweise
# das, was `node werkzeuge/vorschau.mjs` daheim ausliefert.
#
# ── Die zwei Fallstricke, die hier abgefangen sind ───────────────────
#
# 1. `.nojekyll` im Wurzelverzeichnis. Ohne diese leere Datei schiebt
#    GitHub Pages jede Auslieferung durch Jekyll, und Jekyll schluckt
#    stillschweigend jeden Ordner mit führendem Unterstrich — ohne
#    Fehlermeldung. Die Datei wäre einfach 404.
# 2. Alle Importpfade sind relativ. Unter
#    https://kimpaliz.github.io/hatred/ liegt die Seite in einem
#    Unterordner; ein `/runtime/start.js` zeigte dort ins Leere. Das ist
#    der häufigste Grund, warum ein Spiel daheim läuft und im Netz weiß
#    bleibt. Der Schritt „Pfade prüfen" bricht deshalb ab.
#
# ── Arbeitet zusammen mit ────────────────────────────────────────────
#
# `.nojekyll`, `index.html`, `werkzeuge/vorschau.mjs`,
# `werkzeuge/pruefe-verweise.mjs`.

name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.stellen.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prüfkette
        run: node werkzeuge/pruefe-alles.mjs

      - name: Pfade prüfen
        run: node werkzeuge/pruefe-verweise.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - id: stellen
        uses: actions/deploy-pages@v4
