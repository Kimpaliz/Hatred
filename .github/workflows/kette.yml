# [Aufgabe: Werkzeug] Dieselbe Prüfkette auf Pull Requests und main.
#
# Arbeitet zusammen mit werkzeuge/pruefe-alles.mjs und docs/ENTWICKLUNG.md.
# Dieser Ablauf prüft ausschließlich. Die getrennte Veröffentlichung aus
# gh-pages wird nur im ausdrücklich autorisierten Auftrag bedient.

name: Hatred prüfen

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kette-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prüfkette
        run: node werkzeuge/pruefe-alles.mjs
