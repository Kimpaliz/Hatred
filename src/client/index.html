<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Golden Path Game</title>
    <link rel="icon" href="/dashboard/icon.png" type="image/png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">Dashboard Games · sichere Referenz</p>
      <h1>Golden Path Game</h1>
      <p id="status" class="status" role="status">Verbindung wird vorbereitet …</p>

      <section id="invite-choice" class="panel" hidden>
        <h2>Einladung annehmen</h2>
        <p>Du kannst diese Runde als Gast ohne Fortschritt und Statistiken spielen oder dich über das Dashboard anmelden.</p>
        <label>
          Anzeigename
          <input id="guest-name" maxlength="32" autocomplete="nickname" value="Gast">
        </label>
        <div class="actions">
          <button id="join-guest" type="button">Als Gast beitreten</button>
          <button id="join-dashboard" class="secondary" type="button">Mit Dashboard anmelden</button>
        </div>
      </section>

      <section id="game" class="panel" hidden>
        <h2 id="welcome">Verbunden</h2>
        <p id="session-kind"></p>
        <div class="actions">
          <button id="create-invite" type="button">Mitspieler einladen</button>
        </div>
        <output id="invite-output" class="invite-output"></output>
        <div class="playfield">
          <!-- TODO(gameplay): Hier die eigentliche Spiellogik und Darstellung einbauen. -->
          Spielfläche der Vorlage
        </div>
      </section>
    </main>
    <script type="module" src="/app.mjs"></script>
  </body>
</html>
