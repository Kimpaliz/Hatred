schemaVersion: 2
id: golden-path-game
name: Golden Path Game
summary: Sichere Fullstack-Vorlage für ein Dashboard-Multiplayer-Spiel.
description: Referenzimplementierung für Launch, Einladungen, Gastzugang und den Games-v1-Plattformvertrag.
version: 2.1.0
apiCompatibility: games-v1

runtime:
  type: fullstack
  port: 8080
  healthPath: /healthz
  versionPath: /version.json
  websocketPath: /ws

capabilities:
  multiplayer: true
  persistentProgress: false
  achievements: false
  leaderboards: false

resources:
  cpu: 0.5
  memoryMb: 256
  pids: 128

media:
  coverPath: public/dashboard/cover.png
  heroPath: public/dashboard/hero.png
  iconPath: public/dashboard/icon.png
